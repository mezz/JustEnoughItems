buildscript {
	repositories {
		maven { url = 'https://files.minecraftforge.net/maven' }
		mavenCentral()
	}
	dependencies {
		classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: "[6.0.24,6.2)"
	}
}

import net.minecraftforge.gradle.common.util.Utils
import net.minecraftforge.gradle.common.util.VersionJson
import org.apache.commons.io.FileUtils

import java.io.ByteArrayOutputStream
import java.nio.file.FileSystems
import java.nio.file.Files
import java.nio.file.StandardCopyOption

configurations.all {
	// lwjgl:3.3.0 has support for apple silicon
	resolutionStrategy {
		force "org.lwjgl:lwjgl-glfw:3.3.0"
		force "org.lwjgl:lwjgl-jemalloc:3.3.0"
		force "org.lwjgl:lwjgl-openal:3.3.0"
		force "org.lwjgl:lwjgl-opengl:3.3.0"
		force "org.lwjgl:lwjgl-stb:3.3.0"
		force "org.lwjgl:lwjgl-tinyfd:3.3.0"
		force "org.lwjgl:lwjgl:3.3.0"
	}
}

task extractLwjglNatives(type: ExtractLwjglNatives) {
	meta = tasks.extractNatives.meta
	output = tasks.extractNatives.output
	outputs.upToDateWhen { false }
}

extractNatives {
	finalizedBy extractLwjglNatives
}

// Extract LWJGL natives from the native JARs provided by LWJGL on Maven Central
abstract class ExtractLwjglNatives extends DefaultTask {
	@InputFile
	abstract RegularFileProperty getMeta();

	@OutputDirectory
	abstract DirectoryProperty getOutput();

	@TaskAction
	void run() {
		def os = VersionJson.OS.current
		def osName = os == VersionJson.OS.OSX ? 'macos' : os.name
		def classifier = osName
		def arch = getClientJavaArch()
		if (['aarch64', 'arm64'].contains(arch)) {
			classifier += '-arm64'
		}
		def json = Utils.loadJson(meta.getAsFile().get(), VersionJson.class)
		json.getNatives()
			.stream()
			.filter {it.path.startsWith('org/lwjgl') }
			.each {
				def version = '3.3.0'
				def type = it.path.split(/\//)[2]
				def path = "org/lwjgl/$type/$version/$type-$version-natives-${classifier}.jar"
				def target = Utils.getCache(getProject(), 'libraries', path)
				def url = new URL("https://repo1.maven.org/maven2/$path")
				if (!target.exists()) {
					if (!target.getParentFile().exists()) {
						target.getParentFile().mkdirs()
					}
					FileUtils.copyURLToFile(url, target)
				}
				def rootPath = FileSystems.newFileSystem(target.toPath(), new HashMap<>()).getPath('/')
				Files.walk(rootPath.resolve(osName))
					.filter { Files.isRegularFile(it) }
					.filter {
						def fileName = it.fileName.toString()
						fileName.endsWith('.dylib') || fileName.endsWith('.jnilib')
					}
					.each {
						def outputFile = getOutput().get().getAsFile()
						def filePath = outputFile.toPath().resolve(it.fileName.toString())
						if (!filePath.getParent().toFile().exists()) {
							filePath.getParent().toFile().mkdirs()
						}
						Files.copy(it, filePath, StandardCopyOption.REPLACE_EXISTING)
					}
			}
		extractJavaObjcBridgeNative()
	}

	private String getClientJavaArch() {
		def runClient = project.tasks.findByName('runClient')
		def executable = null
		if (runClient != null && runClient.hasProperty('javaLauncher') && runClient.javaLauncher.isPresent()) {
			executable = runClient.javaLauncher.get().executablePath.asFile
		} else if (runClient != null && runClient.hasProperty('executable') && runClient.executable != null) {
			executable = project.file(runClient.executable)
		}
		if (executable == null) {
			return System.getProperty('os.arch')
		}
		def javaSettings = new ByteArrayOutputStream()
		project.exec {
			commandLine(executable, '-XshowSettings:properties', '-version')
			standardOutput = javaSettings
			errorOutput = javaSettings
			ignoreExitValue = true
		}
		def matcher = javaSettings.toString() =~ /os\.arch = (\S+)/
		if (matcher.find()) {
			return matcher.group(1)
		}
		return System.getProperty('os.arch')
	}

	private void extractJavaObjcBridgeNative() {
		def dependency = project.dependencies.create('ca.weblite:java-objc-bridge:1.1')
		def configuration = project.configurations.detachedConfiguration(dependency)
		configuration.transitive = false
		def target = configuration.singleFile
		def rootPath = FileSystems.newFileSystem(target.toPath(), new HashMap<>()).getPath('/')
		def nativePath = rootPath.resolve('libjcocoa.dylib')
		if (Files.isRegularFile(nativePath)) {
			def outputFile = getOutput().get().getAsFile()
			def filePath = outputFile.toPath().resolve(nativePath.fileName.toString())
			Files.copy(nativePath, filePath, StandardCopyOption.REPLACE_EXISTING)
		}
	}
}
