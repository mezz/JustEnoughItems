name: 'Build and Test'

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: 'gradle'

      - name: Require tests for source changes
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/require_tests_for_source_changes.py

      - name: Check style and tests
        run: ./gradlew check --no-daemon

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Copy together artifacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir dist
          cp Common/build/libs/*.jar dist
          cp CommonApi/build/libs/*.jar dist
          cp Core/build/libs/*.jar dist
          cp Fabric/build/libs/*.jar dist
          cp FabricApi/build/libs/*.jar dist
          cp Forge/build/libs/*.jar dist
          cp ForgeApi/build/libs/*.jar dist
          cp Gui/build/libs/*.jar dist
          cp Library/build/libs/*.jar dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          if-no-files-found: error
          path: dist/*
