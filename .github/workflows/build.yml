name: 'Build'

on:
  push:
    branches:
      - '1.21.1'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: |
            21
            25

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: |
            caches/neoformruntime/intermediate_results

      # Reuse Minecraft transformations across source-only changes and PR reruns.
      - name: Cache Minecraft artifacts
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/neoformruntime/intermediate_results
          key: neoform-minecraft-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle.properties', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/**', '**/accesstransformer.cfg') }}

      - name: Build and run server tests
        run: ./gradlew :Forge:build :Fabric:build :NeoForge:build :Common:build :NeoForge:runGameTestServer

      - name: Run Client GameTests
        timeout-minutes: 10
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            # Keep client JVMs sequential even with the configuration cache enabled.
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              ./gradlew :Fabric:runClientGameTest :Fabric:runClientGameTestWithoutAmecs :NeoForge:runClientRecipeSyncTest --max-workers=1
          else
            echo "::error::xvfb-run is required for client GameTests."
            exit 1
          fi

      - name: Copy together artifacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir dist
          cp Common/build/libs/*.jar dist
          cp Fabric/build/libs/*.jar dist
          cp Forge/build/libs/*.jar dist
          cp NeoForge/build/libs/*.jar dist
          cp Gui/build/libs/*.jar dist
          cp Library/build/libs/*.jar dist

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          if-no-files-found: error
          path: dist/*
