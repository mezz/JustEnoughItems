name: 'Build'

on:
  push:
    branches:
      - '1.21.1'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: |
            21
            25

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build with Gradle
        run: |
          ./gradlew :Forge:build --no-daemon
          ./gradlew :Fabric:build --no-daemon
          ./gradlew :NeoForge:build --no-daemon
          ./gradlew :Common:build --no-daemon

      - name: Run NeoForge GameTests
        run: ./gradlew :NeoForge:runGameTestServer --no-daemon

      - name: Run Client GameTests
        timeout-minutes: 10
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" ./gradlew :Fabric:runClientGameTest --no-daemon
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" ./gradlew :Fabric:runClientGameTestWithoutAmecs --no-daemon
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" ./gradlew :NeoForge:runClientRecipeSyncTest --no-daemon
          else
            echo "::error::xvfb-run is required for client GameTests."
            exit 1
          fi

      - name: Copy together artifacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir dist
          cp Common/build/libs/*.jar dist
          cp Fabric/build/libs/*.jar dist
          cp Forge/build/libs/*.jar dist
          cp NeoForge/build/libs/*.jar dist
          cp Gui/build/libs/*.jar dist
          cp Library/build/libs/*.jar dist

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          if-no-files-found: error
          path: dist/*
