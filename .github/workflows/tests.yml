name: 'Tests'

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run unit tests and server GameTests
        run: ./gradlew test :Fabric:runGameTest :NeoForge:runGameTestServer :NeoForge:clientGameTestClasses --no-daemon

      - name: Run Client GameTests
        timeout-minutes: 10
        env:
          # Let Mesa choose a visual when SDL cannot match Minecraft's sRGB request.
          SDL_OPENGL_FORCE_SRGB_FRAMEBUFFER: skip
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            # Loom starts Xvfb automatically for Linux client runs in CI.
            ./gradlew :Fabric:runClientGameTest --no-daemon
          else
            echo "::error::xvfb-run is required for client GameTests."
            exit 1
          fi
