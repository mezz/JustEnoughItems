name: 'Needs Tests'

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  needs-tests:
    name: Needs Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Require tests for source changes
        run: python3 .github/scripts/require_tests_for_source_changes.py
