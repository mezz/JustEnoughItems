# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# JEI
modName=Just Enough Items
modId=jei
modAuthor=mezz
# http://maven.apache.org/guides/mini/guide-naming-conventions.html
modGroup=mezz.jei
modDescription=JEI is an item and recipe viewing mod for Minecraft, built from the ground up for stability and performance.
# Minecraft 26.1 requires Java 25
modJavaVersion=25
githubUrl=https://github.com/mezz/JustEnoughItems

# Minecraft
minecraftVersion=26.1-snapshot-1
minecraftVersionRange=[26.1-snapshot-1]
# https://projects.neoforged.net/neoforged/neoform
neoformVersionAndTimestamp=26.1-snapshot-1-3
# Earliest version of minecraft that is still compatible
minecraftVersionRangeStart=26.1-snapshot-1

# Neoforge
# https://projects.neoforged.net/neoforged/neoforge
neoforgeVersion=26.1.0.0-alpha.4+snapshot-1
neoforgeLoaderVersionRange=[4,)
# first version with tooltip support for FluidStack https://github.com/neoforged/NeoForge/pull/2887
neoforgeVersionRange=[26.1.0.0-alpha.4+snapshot-1,)
neogradle.subsystems.conventions.runs.create-default-run-per-type=false

# Fabric
# https://fabricmc.net/develop/
fabricLoaderVersion=0.18.3
fabricApiVersion=0.140.3+26.1
fabricLoaderVersionRange=>=0.17.0
# This version had breaking API changes to rename many classes: https://github.com/FabricMC/fabric-api/pull/5060
fabricApiVersionRange=>=0.140.3+26.1

# Publishing
curseProjectId=238222
curseHomepageUrl=https://www.curseforge.com/minecraft/mc-mods/jei
modrinthId=u6dRKJwZ

# Dependencies
jUnitVersion=5.10.2
mixinVersion=0.8.5

# Version
specificationVersion=28.2.0
