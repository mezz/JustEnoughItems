# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# JEI
modName=Just Enough Items
modId=jei
modAuthor=mezz
# http://maven.apache.org/guides/mini/guide-naming-conventions.html
modGroup=mezz.jei
modDescription=JEI is an item and recipe viewing mod for Minecraft, built from the ground up for stability and performance.
# Mojang ships Java 21 to end users in 1.20.5+
modJavaVersion=21
githubUrl=https://github.com/mezz/JustEnoughItems

# Minecraft
minecraftVersion=1.21.11
minecraftVersionRange=[1.21.11]
# https://projects.neoforged.net/neoforged/neoform
neoformVersionAndTimestamp=1.21.11-20251209.172050
# Earliest version of minecraft that is still compatible
minecraftVersionRangeStart=1.21.11

# Neoforge
# https://projects.neoforged.net/neoforged/neoforge
neoforgeVersion=21.11.13-beta
neoforgeLoaderVersionRange=[4,)
# 21.11.13-beta is the first version with separate CTRL and CMD hotkeys: https://github.com/neoforged/NeoForge/pull/2872
neoforgeVersionRange=[21.11.13-beta,)
neogradle.subsystems.conventions.runs.create-default-run-per-type=false

# Fabric
# https://fabricmc.net/develop/
fabricLoaderVersion=0.18.2
fabricApiVersion=0.139.5+1.21.11
fabricLoaderVersionRange=>=0.17.0
fabricApiVersionRange=>=0.139.0+1.21.11

# Mappings
# https://parchmentmc.org/docs/getting-started
parchmentMinecraftVersion=1.21.10
parchmentVersionFabric=2025.10.12

# Publishing
curseProjectId=238222
curseHomepageUrl=https://www.curseforge.com/minecraft/mc-mods/jei
modrinthId=u6dRKJwZ

# Dependencies
jUnitVersion=5.10.2
mixinVersion=0.8.5

# Version
specificationVersion=27.3.0
