# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# NeoForge ModDev does not support isolated projects.
org.gradle.isolated-projects=false

# JEI
modName=Just Enough Items
modId=jei
configModId=mezz_config
configGuiModId=mezz_config_gui
configModGroup=net.mezzdev.config
modAuthor=mezz
# http://maven.apache.org/guides/mini/guide-naming-conventions.html
modGroup=mezz.jei
modDescription=JEI is an item and recipe viewing mod for Minecraft, built from the ground up for stability and performance.
# Minecraft 26.4 requires Java 25
modJavaVersion=25
githubUrl=https://github.com/mezz/JustEnoughItems

# Minecraft
minecraftVersion=26.4-snapshot-3
minecraftVersionRange=[26.4-snapshot-3]
# Earliest version of minecraft that is still compatible
minecraftVersionRangeStart=26.4-snapshot-3
# Vanilla test-server runtime
neoformVersionAndTimestamp=26.4-snapshot-3-1

# NeoForge
# https://projects.neoforged.net/neoforged/neoforge
# TODO 26.4: replace the 26.3 coordinates with a build of the intended GitHub port branch.
neoforgeVersion=26.3.0.38-beta
neoforgeLoaderVersionRange=[4,)
neoforgeVersionRange=[26.3.0.1-beta,)

# Fabric
# https://fabricmc.net/develop/
fabricLoaderVersion=0.19.5
fabricApiVersion=0.162.2+26.4
fabricLoaderVersionRange=>=0.19.0
fabricApiVersionRange=>=0.162.2+26.4

# Publishing
curseProjectId=238222
curseHomepageUrl=https://www.curseforge.com/minecraft/mc-mods/jei
modrinthId=u6dRKJwZ
mezzConfigCurseForgeProjectSlug=mezzconfig
mezzConfigModrinthProjectId=7tEfOcA7
mezzConfigGuiCurseForgeProjectSlug=mezzconfiggui
mezzConfigGuiModrinthProjectId=BOHUKqOz

# Dependencies
# TODO 26.4: MezzConfig and MezzConfigGui need builds for minecraftVersion.
# https://maven.blamejared.com/net/mezzdev/config/mezz_config-26.3-config-api/maven-metadata.xml
mezzConfigVersion=0.6.6
mezzConfigVersionRange=[0.6.3,1.0.0)
mezzConfigFabricVersionRange=>=0.6.3 <1.0.0
# https://maven.blamejared.com/net/mezzdev/config/mezz_config_gui-26.3-config-gui-api/maven-metadata.xml
mezzConfigGuiVersion=mc26.3-0.6.2
mezzConfigGuiMinimumVersion=0.6.2
# Accept compatible patch releases in the 0.6 API line.
mezzConfigGuiMaximumVersion=0.7
jUnitVersion=6.1.3
# https://lucene.apache.org/core/
luceneVersion=10.5.0

# Version
specificationVersion=32.0.0

# API compatibility baseline
apiCompatibilityMinecraftVersion=26.3
apiCompatibilityBaselineVersion=31.7.0.45
