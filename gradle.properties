# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# JEI
modName=Just Enough Items
modId=jei
modAuthor=mezz
# http://maven.apache.org/guides/mini/guide-naming-conventions.html
modGroup=mezz.jei
modDescription=JEI is an item and recipe viewing mod for Minecraft, built from the ground up for stability and performance.
# Minecraft 26.1 requires Java 25
modJavaVersion=25
githubUrl=https://github.com/mezz/JustEnoughItems

# Minecraft
minecraftVersion=26.2
minecraftVersionRange=[26.2, 26.2]
# https://projects.neoforged.net/neoforged/neoform
neoformVersionAndTimestamp=26.2-1
# Earliest version of minecraft that is still compatible
minecraftVersionRangeStart=26.2

# Neoforge
# https://projects.neoforged.net/neoforged/neoforge
neoforgeVersion=26.2.0.6-beta
neoforgeLoaderVersionRange=[4,)
# first version with net.neoforged.neoforge.event.TagsUpdatedEvent.ClientPacketReceived https://github.com/neoforged/NeoForge/pull/3171
neoforgeVersionRange=[26.2.0.3-beta,)
neogradle.subsystems.conventions.runs.create-default-run-per-type=false

# Fabric
# https://fabricmc.net/develop/
fabricLoaderVersion=0.19.3
fabricApiVersion=0.152.2+26.2
fabricLoaderVersionRange=>=0.19.0
# This version had breaking API changes to rename many classes: https://github.com/FabricMC/fabric-api/pull/5060
fabricApiVersionRange=>=0.152.2+26.2

# AMECS (Fabric only, for keybinds with modifiers)
# https://maven.siphalor.de/de/siphalor/amecsapi-1.20/maven-metadata.xml
amecsMinecraftVersion=mc26.1.0
amecsVersionFabric=1.0.2

# Publishing
curseProjectId=238222
curseHomepageUrl=https://www.curseforge.com/minecraft/mc-mods/jei
modrinthId=u6dRKJwZ

# Dependencies
jUnitVersion=5.10.2
# https://jenkins.liteloader.com/view/Other/job/Mixin/
mixinVersion=0.8.7
# https://central.sonatype.com/artifact/net.mezzdev/suffixtree
suffixtreeVersion=1.1.0

# Version
specificationVersion=30.6.0
